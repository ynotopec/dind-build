apiVersion: v1
kind: Pod
metadata:
  name: dind-build
  labels:
    app: dind-build
spec:
  containers:
  - name: docker
    image: docker:24-dind
    args: ["--insecure-registry", "registry:5000"]
    securityContext:
      privileged: true
    startupProbe:
      exec:
        command: ["docker", "info"]
      periodSeconds: 1
      failureThreshold: 60
    readinessProbe:
      exec:
        command: ["docker", "info"]
      periodSeconds: 5
    volumeMounts:
    - name: docker-storage
      mountPath: /var/lib/docker
  volumes:
  - name: docker-storage
    emptyDir:
      sizeLimit: 5Gi

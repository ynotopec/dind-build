{{- $host := required "ingress.host is required because registry TLS is mandatory" .Values.ingress.host }}
{{- $clusterIssuer := required "certManager.clusterIssuer is required because registry TLS is mandatory" .Values.certManager.clusterIssuer }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  labels:
    {{- include "docker-build.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $clusterIssuer | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 5000
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ required "ingress.tls.secretName is required because registry TLS is mandatory" .Values.ingress.tls.secretName | quote }}

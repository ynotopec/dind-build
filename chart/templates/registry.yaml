apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    {{- include "docker-build.labels" . | nindent 4 }}
spec:
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels:
    {{- include "docker-build.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        {{- include "docker-build.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: {{ .Values.registry.image | quote }}
          ports:
            - containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: registry-storage
              mountPath: /var/lib/registry
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: registry-storage
          emptyDir:
            sizeLimit: {{ .Values.registry.storageSizeLimit | quote }}
